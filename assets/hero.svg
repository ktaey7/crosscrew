<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">Crosscrew — Your workspace. More perspectives.</title>
<desc id="desc">Crosscrew connects the AI environment you already use to other native AI CLIs for an independent perspective.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101629"/><stop offset="1" stop-color="#202448"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#73E8CF"/><stop offset="1" stop-color="#A49BFF"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="480" rx="24" fill="url(#bg)"/>
<rect width="1280" height="480" rx="24" fill="url(#grid)"/>
<circle cx="1160" cy="60" r="220" fill="#8575F5" opacity=".06"/>
